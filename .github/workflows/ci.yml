# QBTM CI: one gate, the canonical entrypoint.
#
# Runs scripts/run_tests.sh (configure + build the pybind11 binding against the
# pinned 3.11 interpreter, then ctest + pytest) on every pull request (including
# stacked PRs whose temporary base is another feature branch) and on pushes to
# main. This is the SAME entrypoint local dev and every later agent use; CI adds
# no bespoke test logic. Pinned stack: requirements.txt.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + ctest + pytest (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg        # headless matplotlib (some tests import pyplot)
      PYTHON: python         # entrypoint builds + tests with this interpreter
      CTEST_WORKERS: 4       # independent C++ test executables in parallel
      PYTEST_WORKERS: 3      # xdist file shards, BLAS pinned to 1 per worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        run: |
          python --version
          cmake --version

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build binding + run baseline suite (ctest + pytest)
        run: scripts/run_tests.sh
